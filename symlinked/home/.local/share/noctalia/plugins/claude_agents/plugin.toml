# Bar widget showing Claude Code session status: `claude agents --json` roster joined
# with the agents-feed mod's snapshots (~/.cache/claude-agents/).
id = "kyle/claude_agents"
name = "Claude Agents"
version = "0.1.0"
plugin_api = 26
author = "kyle"
license = "MIT"
dependencies = []
tags = ["claude"]
icon = "robot"
description = "A die for what your Claude Code sessions need from you, plus 5h / 7d usage meters."

[[widget]]
id = "status"
entry = "status.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 1000
height = "fill"
placement = "floating"
position = "center_right"

