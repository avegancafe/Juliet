# Noctalia 5 config. Hand-written layer; GUI changes land in
# ~/.local/state/noctalia/settings.toml and override this file.

[theme]
mode = "dark"
source = "custom"
custom_palette = "Bamboo"  # palettes/Bamboo.json

# Noctalia locks with its own lock screen on logind PrepareForSleep (lid close,
# systemctl suspend) unless this is off. hypridle runs hyprlock before sleep
# instead (symlinked/config/hypr/hypridle.conf), so the lock screen is the same
# minimal black one whether you lock by hand or by closing the lid.
[lockscreen]
lock_before_suspend = false

[shell]
font_family = "Iosevka Nerd Font Mono"

[shell.animation]
enabled = false

# Floating, not attached: an attached control center inherits the bar's
# background, which is transparent (see [bar.default]).
[shell.panel]
control_center_placement = "floating"

[wallpaper]
directory = "~/.config/Juliet/etc/wallpaper"
fill_mode = "crop"

[wallpaper.default]
path = "~/.config/Juliet/etc/wallpaper/my-neighbor-totoro-sunflowers.png"

# Wallpaper blurred behind niri's overview (pairs with the
# ^noctalia-backdrop layer-rule in niri/config.kdl).
[backdrop]
enabled = true
blur_intensity = 0.4
tint_intensity = 0.6

[location]
address = "Brooklyn"

[nightlight]
enabled = true
temperature_night = 5535

# The bar is floating pills rather than one strip: the bar itself is
# transparent. The active-window pill sits alone in the start lane, 32px in
# from the left (margin_ends); the other three sit together in the center
# lane, 16px apart.
# Rearranging widgets in the Settings GUI writes lanes into
# ~/.local/state/noctalia/settings.toml, which overrides the lanes here.
[bar.default]
background_opacity = 0.0
shadow = false
compositor_blur = false  # else a blurred full-width strip shows behind the pills
margin_edge = 6          # float the pills off the top edge
thickness = 34           # pill height: content + 8px padding top and bottom
capsule_thickness = 1.0  # pills fill the bar height
widget_spacing = 16      # gap between the pills; groups set their own inner spacing
margin_ends = 18         # + the bar's own ~14px end padding = pill 32px from the screen edge
start = ["group:active"]
center = ["group:left", "group:middle", "group:right"]
end = []

[[bar.default.capsule_group]]
id = "active"
members = ["active_window"]
fill = "surface"
opacity = 0.93
padding = 12.0
radius = 4.0
widget_spacing = 6

[[bar.default.capsule_group]]
id = "left"
members = ["launcher", "spacer_3", "cpu", "ram"]
fill = "surface"
opacity = 0.93
padding = 12.0
radius = 4.0
widget_spacing = 6

[[bar.default.capsule_group]]
id = "middle"
members = ["workspaces", "spacer_4", "niri_center"]
fill = "surface"
opacity = 0.93
padding = 12.0
radius = 4.0
widget_spacing = 6

[[bar.default.capsule_group]]
id = "right"
members = [
  "claude",
  "audio_visualizer",
  "tray",
  "power_profile",
  "network",
  "battery",
  "clock",
  "notifications",
]
fill = "surface"
opacity = 0.93
padding = 12.0
radius = 4.0
widget_spacing = 6

[widget.spacer_3]
type = "spacer"
length = 24

[widget.spacer_4]
type = "spacer"
length = 16

# Claude Code background agents (plugin: symlinked/home/.local/share/noctalia/plugins/claude_agents)
[widget.claude]
type = "kyle/claude_agents:status"

# niri centered-focus indicator; click toggles (plugin: .../plugins/niri_center)
[widget.niri_center]
type = "kyle/niri_center:status"

# Local plugins stowed from symlinked/home/.local/share/noctalia/plugins
[plugins]
enabled = ["kyle/claude_agents", "kyle/niri_center"]
