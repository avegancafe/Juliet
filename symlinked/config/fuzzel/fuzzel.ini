[main]
font=Iosevka Nerd Font Mono:size=12
# Render at logical DPI only. Without this, fuzzel scales fonts by the
# monitor's physical DPI (~143 on this class of laptop panel), blowing 12pt
# up ~1.5x while every other app sizes against 96dpi x niri scale.
dpi-aware=no
horizontal-pad=16

[border]
selection-radius=3

[colors]
background=252623ff
text=f1e9d2ff
match=8fb573ff
selection=8fb573ff
selection-text=252623ff

[key-bindings]
# Vim-style list navigation. Ctrl+K is fuzzel's default delete-line-forward,
# so unmap it first or fuzzel rejects the duplicate binding.
delete-line-forward=none
prev=Up Control+p Control+k
next=Down Control+n Control+j
