<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Iosevka Nerd Font Mono is the default for every generic family, so UI chrome,
  documents, and web page text all render in it. Installed by setup-fonts into
  <font-dir>/Juliet.

  Toolkit UI fonts are set separately in gtk-3.0/settings.ini and
  gtk-4.0/settings.ini; Qt apps inherit those because niri exports
  QT_QPA_PLATFORMTHEME=gtk3.

  <prefer> prepends to the distro's generic family lists rather than replacing
  them, so glyphs Iosevka doesn't cover (CJK, Arabic, emoji) still fall through
  to the Noto families underneath.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Iosevka Nerd Font Mono</family></prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer><family>Iosevka Nerd Font Mono</family></prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer><family>Iosevka Nerd Font Mono</family></prefer>
  </alias>

  <!--
    Nerd Font patches monochrome symbol glyphs into ranges that overlap
    text-presentation emoji, and the aliases above would now win those. Keep
    the emoji generic pointed at the colour font.
  -->
  <alias>
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
