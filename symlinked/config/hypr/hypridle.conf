# Hypridle — lock with hyprlock before the machine sleeps (lid close,
# systemctl suspend). Started by niri (spawn-at-startup in niri/config.kdl).
#
# noctalia's own lock-before-suspend is turned off in noctalia/config.toml so it
# doesn't race hyprlock. Don't use `loginctl lock-session` here: noctalia also
# answers logind's Lock signal, so both lockers would start. Run hyprlock directly.
# Because before_sleep_cmd runs hyprlock, hypridle's default inhibit_sleep (auto)
# holds off suspend until the session is actually locked.
#
# bin/sleep-drain-log records what each sleep cost the battery; read it with
# `journalctl -t sleep-drain`.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = ~/.config/Juliet/bin/sleep-drain-log pre; pidof hyprlock || hyprlock
    after_sleep_cmd = niri msg action power-on-monitors; ~/.config/Juliet/bin/sleep-drain-log post
}

# Idle: screen off after 5 minutes, suspend after 15 when on battery. A video
# or call that holds an idle inhibitor stops both. Without these the screen
# stayed lit, and the laptop awake, for as long as the lid was open.
listener {
    timeout = 300
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}

# Battery only: no battery, or one that isn't discharging, means no match and
# no suspend, so this never fires on AC or on a desktop.
listener {
    timeout = 900
    on-timeout = grep -qs Discharging /sys/class/power_supply/BAT*/status && systemctl suspend
}
