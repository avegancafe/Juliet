# Hypridle — lock with hyprlock before the machine sleeps (lid close,
# systemctl suspend). Started by niri (spawn-at-startup in niri/config.kdl).
#
# noctalia's own lock-before-suspend is turned off in noctalia/config.toml so it
# doesn't race hyprlock. Don't use `loginctl lock-session` here: noctalia also
# answers logind's Lock signal, so both lockers would start. Run hyprlock directly.
# Because before_sleep_cmd runs hyprlock, hypridle's default inhibit_sleep (auto)
# holds off suspend until the session is actually locked.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = niri msg action power-on-monitors
}
