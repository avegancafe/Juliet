# Juliet keyd config — dual-role Super (leftmeta).
#
# Installed to /etc/keyd/default.conf by the `setup-keyd` bootstrap step (keyd is
# a root daemon that remaps at the kernel input level, so this can't be a stow
# symlink in $HOME).
#
#   Hold Super  -> acts as the Meta/Super modifier for the WHOLE time it's held,
#                  via keyd's built-in `meta` layer. Every niri "Mod+..." bind
#                  keeps working exactly as before — no timing caveats.
#   Tap  Super  -> emits F13, which niri binds to toggle the noctalia Control
#                  Center (the bar's right-click menu). See the F13 bind in
#                  symlinked/config/niri/config.kdl.
#
# F13 is a phantom key (no physical keycap), so it never collides with real input.
#
# Trade-off (accepted): with plain `overload`, holding Super and releasing
# WITHOUT pressing another key still counts as a tap and opens the Control Center.
# If that misfires too often, swap the action for:
#     leftmeta = overloadt2(meta, f13, 200)
# which only emits F13 on a quick (<200ms) release and treats longer holds and
# any chord purely as the modifier. It's left off by default because plain
# `overload` keeps the modifier active unconditionally, which is the safest
# guarantee that Mod-as-modifier is never weakened.

[ids]
*

[main]
leftmeta = overload(meta, f13)
