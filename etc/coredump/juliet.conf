# Managed by Juliet: installed to /etc/systemd/coredump.conf.d/juliet.conf by
# bin/bootstrap.d/60-desktop.bash :: setup-coredump-limits. Edit here, not in /etc.
# A runaway crash loop once wrote 4.1GB of cores here unnoticed; these caps
# keep any repeat bounded.
[Coredump]
MaxUse=512M
KeepFree=2G
ProcessSizeMax=256M
