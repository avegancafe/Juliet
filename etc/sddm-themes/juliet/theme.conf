[General]
# Font for the whole greeter. Matches hyprlock.conf, ghostty and neovim.
font=Iosevka Nerd Font Mono

# Background image. Left empty the greeter is solid black, matching the
# hyprlock lock screen (Super+Alt+L). To use an image instead, drop it in this
# directory and name it here, e.g. background=background.png
background=

# The greeter prompts for a username rather than listing users with avatars,
# so SDDM does not need to build the full user model.
needsFullUserModel=false
