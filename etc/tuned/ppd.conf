# Managed by Juliet: installed to /etc/tuned/ppd.conf by
# bin/bootstrap.d/60-desktop.bash :: setup-battery-profile. Edit here, not in
# /etc. This is tuned-ppd's stock file with one change: on battery, "balanced"
# maps to juliet-battery (etc/tuned/juliet-battery/tuned.conf) instead of
# Fedora's balanced-battery.

[main]
# The default PPD profile
default=balanced
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
# PPD = TuneD
power-saver=powersave
balanced=balanced
performance=throughput-performance

[battery]
# PPD = TuneD
balanced=juliet-battery
