# Managed by Juliet: installed to /etc/tuned/profiles/juliet-battery/tuned.conf
# by bin/bootstrap.d/60-desktop.bash :: setup-battery-profile. Edit here, not
# in /etc.
#
# What tuned applies when the laptop is on battery and the power profile is
# "balanced" (etc/tuned/ppd.conf maps it). Fedora's own balanced-battery leaves
# turbo on, which on a 45 W H-series CPU is where most of the browsing watts
# go. tuned undoes all of this when AC comes back or another profile is picked
# ("performance" in the noctalia power-profile switch brings turbo back).
#
# Check it took: tuned-adm active
#                cat /sys/devices/system/cpu/intel_pstate/no_turbo   (1)

[main]
summary=Juliet battery profile: no turbo, EPP power, PCI runtime PM
include=balanced-battery

[cpu]
energy_performance_preference=power
# boost, not no_turbo: the inherited balanced profile sets boost=1, and under
# intel_pstate tuned turns boost=0 into no_turbo=1.
boost=0

# Runtime PM for the PCI devices that default to always-on (USB controller,
# Wi-Fi, NVMe, host bridge), and the deepest PCIe link power state. Both let
# the CPU package reach deeper idle states. If Wi-Fi or the SSD misbehaves on
# battery, delete this section; the [cpu] one stands alone.
[sysfs]
/sys/bus/pci/devices/*/power/control=auto
/sys/module/pcie_aspm/parameters/policy=powersupersave
